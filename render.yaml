# Existing Render Postgres. Do not put passwords in this file.
databases:
  - name: example_spaer_instance
    plan: free
    databaseName: example_spaer_instance
    user: example_spaer_instance_user

services:
  - type: web
    name: inventory-api
    runtime: docker
    plan: free
    region: singapore
    branch: feature/phase-1-java-backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: example_spaer_instance
          property: connectionString
      - key: DEV_OTP_BYPASS
        value: "true"
      - key: DEV_OTP_CODE
        value: "000000"
      - key: LOG_OTP
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0 -XX:+UseSerialGC"
