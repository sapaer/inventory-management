# Do not declare a database here. Render allows only one free Postgres,
# and example_spaer_instance already exists. Paste its Internal Database URL
# as DATABASE_URL when applying this Blueprint.
services:
  - type: web
    name: inventory-api
    runtime: docker
    plan: free
    region: singapore
    branch: feature/phase-1-java-backend
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: "prod"
      - key: DATABASE_URL
        sync: false
      - key: DEV_OTP_BYPASS
        value: "true"
      - key: DEV_OTP_CODE
        value: "000000"
      - key: LOG_OTP
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0 -XX:+UseSerialGC"
