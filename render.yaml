databases:
  - name: inventory-db
    plan: free
    region: singapore
    databaseName: inventory
    user: inventory

services:
  - type: web
    name: inventory-api
    runtime: docker
    plan: free
    region: singapore
    branch: feature/phase-1-java-backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: DEV_OTP_BYPASS
        value: "true"
      - key: DEV_OTP_CODE
        value: "000000"
      - key: LOG_OTP
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0 -XX:+UseSerialGC"
