server:
  port: ${PORT:8080}

spring:
  application:
    name: inventory-management
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${SPRING_DATASOURCE_USERNAME:inventory}
    password: ${SPRING_DATASOURCE_PASSWORD:inventory}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

app:
  log-otp: ${LOG_OTP:true}
  jwt:
    secret: ${JWT_SECRET:QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=}
    access-expiry-hours: ${JWT_ACCESS_EXPIRY_HOURS:24}
    refresh-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:30}
  aws:
    s3-bucket: ${AWS_S3_BUCKET:local-bucket}
    s3-region: ${AWS_S3_REGION:ap-south-1}
    access-key: ${AWS_ACCESS_KEY:local}
    secret-key: ${AWS_SECRET_KEY:local}
    cloudfront-url: ${CLOUDFRONT_URL:http://localhost}
  whatsapp:
    api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v18.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
  sms:
    provider: ${SMS_PROVIDER:msg91}
    auth-key: ${SMS_AUTH_KEY:}
    sender-id: ${SMS_SENDER_ID:}
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}
